<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body><div id="root" class="hidden"><div class="win"><header><div><small>COOKIE ADMIN · MAP</small><h1>맵 위치표시</h1><p>네이티브 Blip + 커스텀 YTD 이미지 슬롯</p></div><button id="close">×</button></header><main><section><div class="head"><b>등록된 위치</b><button id="new">+ 새 위치</button></div><div id="list"></div></section><section id="editor" class="hidden"><div class="head"><b id="title">새 위치</b></div><input id="id" type="hidden"><label>표시 이름<input id="label" placeholder="예: 메인차고"></label><label>커스텀 이미지 슬롯<select id="preset"><option value="">직접 Sprite 설정</option></select></label><div id="presetHelp" class="preset-help"></div><div class="coords"><code id="coords">좌표 미설정</code><button id="mypos">현재 위치</button></div><div class="grid"><label>Sprite<input id="sprite" type="number" value="280"></label><label>Color<input id="colour" type="number" value="3"></label><label>크기<input id="scale" type="number" step="0.05" value="0.85"></label><label>투명도<input id="alpha" type="number" value="255"></label></div><div class="checks"><label><input id="short" type="checkbox" checked> 근거리 표시</label><label><input id="active" type="checkbox" checked> 활성</label></div><p class="note">커스텀 이미지는 <b>cookie_mapblips/stream/minimap.ytd</b>에서 해당 radar_* 슬롯을 교체하는 방식입니다. YTD가 없으면 GTA 기본 아이콘으로 표시됩니다.</p><div class="actions"><button id="del" class="danger hidden">삭제</button><button id="cancel">취소</button><button id="save" class="primary">저장</button></div></section></main></div></div><script src="app.js"></script></body></html>
